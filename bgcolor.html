<!DOCTYPE html>
<html>
<head>
    <title>Background Color</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<button id="btn">Change Color</button>

<script>
$(document).ready(function() {
    $("#btn").click(function() {
        $("body").css("background-color", "lightblue");
    });
});
</script>

</body>
</html>
