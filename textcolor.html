<!DOCTYPE html>
<html>
<head>
    <title>Text Color</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<p id="text">Hello Students!</p>

<button id="btn">Change Text Color</button>

<script>
$(document).ready(function() {
    $("#btn").click(function() {
        $("#text").css("color", "red");
    });
});
</script>

</body>
</html>
