<!DOCTYPE html>
<html>
<head>
    <title>Change Text</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<p id="text">Waqees</p>

<button id="btn">Change Text</button>

<script>
$(document).ready(function() {
    $("#btn").click(function() {
        $("#text").text("Ali");
    });
});
</script>

</body>
</html>
