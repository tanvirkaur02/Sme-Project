<!DOCTYPE html>
<html>
<head>
    <title>Bold Text</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<p id="text">Hello Students!</p>
<button id="btn">Make Bold</button>

<script>
$(document).ready(function() {
    $("#btn").click(function() {
        $("#text").css("font-weight", "bold");
    });
});
</script>

</body>
</html>b
